name: Release beta
on:
  push:
    branches: [master]
    paths: [metadata.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-beta
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: glib-compile-schemas --strict --dry-run schemas
      - run: npm run build
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          RELEASE_TAG="v$RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Layout Stripe $(node -p "JSON.parse(require('fs').readFileSync('metadata.json', 'utf8'))['version-name']")" \
            --notes-file RELEASE_NOTES.md
